<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - Blog Spartel</title>
    <!-- Importation simplifiée de Tailwind CSS via CDN pour l'apprentissage -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Configuration des couleurs primaires (optionnel, mais garde la maquette jolie) -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: { 50: '#f0f6ff', 500: '#2673e8', 600: '#1c5bba', 900: '#0a2042' } }
                }
            }
        }
    </script>
    <style>
        /* Toast appearance; JavaScript adds the .toast-success or .toast-error class. */
        .toast {
            width: min(24rem, calc(100vw - 2rem));
            padding: 0.875rem 1rem;
            border-radius: 0.5rem;
            color: white;
            font-size: 0.875rem;
            font-weight: 500;
            box-shadow: 0 4px 12px rgb(0 0 0 / 15%);
        }

        .toast-success {
            background-color: #15803d;
        }

        .toast-error {
            background-color: #b91c1c;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 flex h-screen overflow-hidden md:flex-row min-h-screen">

    <!-- BARRE LATÉRALE (Sidebar) -->
    <aside class="w-64 bg-gray-900 text-white flex flex-col hidden md:block">
        <div class="p-6 border-b border-gray-800">
            <h2 class="text-xl font-bold">Admin Blog</h2>
            <p class="text-xs text-primary-500 mt-1 uppercase font-semibold tracking-wider">Sprint 1</p>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <a href="#" class="block px-4 py-2 rounded text-gray-400 hover:bg-gray-800 hover:text-white transition-colors">Tableau de bord</a>
            <a href="#" class="block px-4 py-2 rounded text-gray-400 hover:bg-gray-800 hover:text-white transition-colors">Articles</a>
            <!-- Lien actif -->
            <a href="#" class="block px-4 py-2 rounded bg-primary-600 text-white font-medium">Catégories</a>
        </nav>
    </aside>

    <!-- CONTENU PRINCIPAL -->
    <div class="flex-1 min-w-0 flex flex-col h-screen overflow-hidden">
        
        <!-- ENTÊTE (Header) -->
        <header class="bg-white h-16 border-b border-gray-200 flex items-center justify-between px-6">
            <div class="font-medium text-gray-600">
                Gestion des catégories
            </div>
            <div class="flex items-center gap-2">
                <span class="text-sm font-semibold">Admin</span>
            </div>
        </header>

        <!-- ZONE DE TRAVAIL (Main) -->
        <main class="flex-1 min-w-0 overflow-y-auto p-6 bg-gray-50">
            <div class="max-w-5xl min-w-0 mx-auto space-y-8">
                
                <!-- SECTION 1 : EN-TÊTE DE LA PAGE -->
                <div class="flex justify-between items-center">
                    <div>
                        <h1 class="text-2xl font-bold text-gray-900">Catégories</h1>
                        <p class="text-sm text-gray-500">Organisez les rubriques de votre blog.</p>
                    </div>
                    <!-- Bouton pour afficher le formulaire (l'action JS sera codée à l'étape 4) -->
                    <button id="btn-show-form" class="bg-primary-600 text-white px-4 py-2 rounded shadow hover:bg-primary-700 transition">
                        + Nouvelle Catégorie
                    </button>
                </div>

                <!-- SECTION 2 : FORMULAIRE D'AJOUT/MODIFICATION (Caché par défaut) -->
                <div id="section-form" class="bg-white p-6 rounded-lg shadow-sm border border-gray-200 hidden">
                    <h2 class="text-lg font-bold mb-4">Ajouter / Modifier une catégorie</h2>
                    <form id="form-categorie" class="space-y-4 grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- Champ caché pour l'ID -->
                        <input type="hidden" id="cat-id" value="">
                        
                        <!-- Champ Nom -->
                        <div>
                            <label for="cat-nom" class="block text-sm font-semibold text-gray-700 mb-1">Nom de la catégorie</label>
                            <input type="text" id="cat-nom" required placeholder="Ex: Développement Web" 
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500">
                        </div>

                        <!-- Champs Couleur et Icône (Simplifiés avec des listes déroulantes classiques) -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label for="cat-couleur" class="block text-sm font-semibold text-gray-700 mb-1">Couleur</label>
                                <select id="cat-couleur" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500">
                                    <option value="">-- Choisir une couleur --</option>
                                    <option value="Bleu">Bleu</option>
                                    <option value="Rose">Rose</option>
                                    <option value="Emeraude">Émeraude</option>
                                    <option value="Violet">Violet</option>
                                </select>
                            </div>
                            <div>
                                <label for="cat-icone" class="block text-sm font-semibold text-gray-700 mb-1">Icône</label>
                                <select id="cat-icone" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500">
                                    <option value="">-- Choisir une icône --</option>
                                    <option value="Code">Code</option>
                                    <option value="Pinceau">Pinceau / Crayon</option>
                                    <option value="Eclair">Éclair</option>
                                    <option value="Livre">Livre</option>
                                </select>
                            </div>
                        </div>

                        <!-- Boutons d'action -->
                        <div class="flex justify-end gap-2 mt-4">
                            <button type="button" id="btn-cancel-form" class="px-4 py-2 text-gray-600 border border-gray-300 rounded hover:bg-gray-100 transition">
                                Annuler
                            </button>
                            <button type="submit" id="btn-enregistrer-categorie" class="px-4 py-2 bg-primary-600 text-white rounded hover:bg-primary-700 transition">
                                Enregistrer
                            </button>
                        </div>
                    </form>
                </div>

                <!-- SECTION 3 : LISTE DES CATÉGORIES -->
                <!-- Scroll horizontally when the table is wider than its container. -->
                <div class="w-full min-w-0 bg-white rounded-lg shadow-sm border border-gray-200 overflow-x-auto overscroll-x-contain">
                    <table class="w-full min-w-[640px] text-left border-collapse">
                        <thead class="bg-gray-50 border-b border-gray-200">
                            <tr>
                                <th class="p-4 text-sm font-semibold text-gray-500 uppercase">ID</th>
                                <th class="p-4 text-sm font-semibold text-gray-500 uppercase">Nom</th>
                                <th class="p-4 text-sm font-semibold text-gray-500 uppercase">Couleur</th>
                                <th class="p-4 text-sm font-semibold text-gray-500 uppercase text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="table-categories-body" class="divide-y divide-gray-100">
                            <!-- Les données seront injectées ici par JavaScript (app.js) -->
                        </tbody>
                    </table>
                </div>

            </div>
        </main>
    </div>

    <!-- Toast container: Tailwind keeps notifications fixed at the bottom-left and stacks them. -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"
         aria-live="polite" aria-atomic="true"></div>

    <!-- Script SPA -->
    <script src="assets/js/app.js"></script>
</body>
</html>
