<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled Interface Components - Tailwind</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen">

    <!-- Global Layout Container (Column on mobile, row on desktop) -->
    <div class="flex flex-col md:flex-row min-h-screen">

        <!-- 1. Dark Styled Sidebar (Hidden on mobile, visible on medium+ screens) -->
        <aside class="hidden md:block w-64 bg-gray-800 text-white flex-col p-6 gap-6">
            <div class="border-b border-gray-600 pb-4">
                <h2 class="text-xl font-bold">Admin Blog</h2>
                <p class="text-xs text-gray-400 mt-1">Sprint 1</p>
            </div>
            <nav class="flex flex-col gap-1 mt-6">
                <a href="#" class="px-3 py-2 rounded-lg text-gray-300 hover:bg-gray-700 hover:text-white transition-colors text-sm">Dashboard</a>
                <a href="#" class="px-3 py-2 rounded-lg text-gray-300 hover:bg-gray-700 hover:text-white transition-colors text-sm">Articles</a>
                <a href="#" class="px-3 py-2 rounded-lg bg-blue-600 text-white font-medium text-sm">Categories</a>
            </nav>
        </aside>

        <!-- Main Content Wrapper -->
        <div class="flex-1 flex flex-col">

            <!-- 2. Light Styled Header -->
            <header class="bg-white border-b border-gray-200 px-4 md:px-6 py-4 flex items-center justify-between shadow-sm">
                <h1 class="text-lg font-semibold text-gray-800">Category Management</h1>
                <span class="text-sm font-medium text-gray-500 bg-gray-100 px-3 py-1 rounded-full">Admin</span>
            </header>

            <!-- Main Body (Responsive padding: p-4 on mobile, p-6 or p-8 on desktop) -->
            <main class="flex-1 p-4 md:p-8">
                <div class="max-w-5xl mx-auto space-y-6">

                    <!-- Section Header with Primary Button -->
                    <section class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <div>
                            <h2 class="text-2xl font-bold text-gray-800">Categories</h2>
                            <p class="text-gray-500 text-sm mt-1">Organize and manage your blog sections.</p>
                        </div>
                        <button type="button" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-blue-700 transition-colors self-start sm:self-auto">
                            + New Category
                        </button>
                    </section>

                    <!-- Styled Form Section (Grid: 1 col on mobile, 2 cols on desktop) -->
                    <section class="bg-white rounded-xl shadow-sm p-6 space-y-4">
                        <h3 class="text-lg font-semibold text-gray-700 border-b pb-3">Add / Edit Category</h3>
                        <form id="form-categorie" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="md:col-span-2">
                                <label class="block text-sm font-medium text-gray-700 mb-1">Name</label>
                                <input type="text" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Ex: Web Development">
                            </div>
                            <div class="md:col-span-2 flex justify-end gap-3 pt-2">
                                <button type="button" class="px-4 py-2 bg-gray-100 text-gray-600 rounded-lg text-sm hover:bg-gray-200 transition-colors">Cancel</button>
                                <button type="submit" id="btn-submit-form" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-semibold hover:bg-blue-700 transition-colors flex items-center gap-2">
                                    <span id="spinner-submit" hidden>⏳</span>
                                    <span id="text-submit">Save</span>
                                </button>
                            </div>
                        </form>
                    </section>

                    <!-- Styled Data Table Section (Responsive Overflow Wrapper) -->
                    <section class="bg-white rounded-xl shadow-sm overflow-hidden">
                        <h3 class="text-lg font-semibold text-gray-700 p-6 border-b">Category List</h3>
                        <div class="overflow-x-auto">
                            <table class="w-full text-sm text-left border-collapse min-w-[600px]">
                                <thead class="bg-gray-50">
                                    <tr>
                                        <th class="text-xs text-gray-500 uppercase px-6 py-3">ID</th>
                                        <th class="text-xs text-gray-500 uppercase px-6 py-3">Name</th>
                                        <th class="text-xs text-gray-500 uppercase px-6 py-3">Color</th>
                                        <th class="text-xs text-gray-500 uppercase px-6 py-3">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="table-categories-body" class="divide-y divide-gray-100">
                                    <tr class="hover:bg-gray-50">
                                        <td class="px-6 py-4 text-gray-500">#1</td>
                                        <td class="px-6 py-4 font-medium text-gray-800">Web Development</td>
                                        <td class="px-6 py-4"><span class="bg-blue-100 text-blue-700 px-2 py-1 rounded-full text-xs">Blue</span></td>
                                        <td class="px-6 py-4 flex gap-2">
                                            <button class="text-blue-600 hover:underline text-xs">Edit</button>
                                            <button class="text-red-500 hover:underline text-xs">Delete</button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </section>

                </div>

                <!-- Toast Notifications Container -->
                <div id="toast-container" class="fixed bottom-4 right-4 flex flex-col gap-2 z-50"></div>
            </main>

        </div>
    </div>

</body>
</html>
